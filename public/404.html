<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>ChatRadix - Shopify WhatsApp Flows</title>
    <script>
      // GitHub Pages SPA 404 redirect trick
      // Saves the original path to sessionStorage, then redirects to root (index.html).
      sessionStorage.setItem('spa_redirect', window.location.pathname + window.location.search + window.location.hash);
      window.location.replace('/');
    </script>
  </head>

</html>
